<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preload" href="assets/three.min.js" as="script">
<link rel="preload" href="assets/space42-assets.js" as="script">
<title>Space42 · From space to Earth</title>
<style>
@font-face{font-family:"AX";src:url(assets/fonts/antarctica-expanded-light.woff2) format("woff2");font-weight:300;font-display:block}
@font-face{font-family:"AX";src:url(assets/fonts/antarctica-expanded-medium.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"AX";src:url(assets/fonts/antarctica-expanded-semibold.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"AR";src:url(assets/fonts/antarctica-light.woff2) format("woff2");font-weight:300;font-display:block}
:root{
  --blue:#121a6b;--ink:#0a0f47;--deep:#04071f;--t700:#1e287f;--t600:#2d399a;--t500:#4651b5;--t400:#7480cc;--t300:#a6aedd;--t200:#cfd3ec;--t100:#e6e8f4;--white:#fff;
  --ease:cubic-bezier(.22,1,.36,1);
  --display:"AX","AR",system-ui,sans-serif;--body:"AR","AX",system-ui,sans-serif;
  --padx:clamp(20px,6vw,96px);
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--white)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#veil{position:fixed;inset:0;background:#c9cfee;opacity:0;pointer-events:none;z-index:2}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui.hidden .chrome{opacity:0}
.chrome{transition:opacity .42s var(--ease)}
#mark{position:absolute;top:calc(env(safe-area-inset-top,0px) + clamp(18px,4vh,40px));right:var(--padx);width:clamp(30px,2.8vw,44px)}
#mark img{width:100%;display:block}

/* story panel */
#panel{position:absolute;left:var(--padx);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(92px,15vh,150px));width:min(540px,calc(100vw - 2*var(--padx)));opacity:0;transition:opacity 1.1s var(--ease)}
#panel.on{opacity:1}
#panel .plogo{height:clamp(22px,2.4vw,34px);margin:0 0 clamp(16px,2.4vh,26px);display:block}
#panel .plogo.big{height:clamp(30px,3.4vw,48px)}
#panel h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,3.7vw,62px);line-height:1.04;letter-spacing:-.025em;margin:0 0 .42em;text-wrap:balance}
#panel p{font-size:clamp(15px,1.15vw,19px);line-height:1.55;color:var(--t200);margin:0;max-width:38ch}
.stats{display:flex;flex-wrap:wrap;gap:clamp(18px,2.4vw,40px);margin-top:clamp(20px,3.2vh,34px)}
.stat{min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(26px,2.5vw,44px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;line-height:1.35;color:var(--t300);margin-top:8px;max-width:17ch}
.stats.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 34px;max-width:470px}
.pill{display:inline-block;margin-top:22px;font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--t400);color:var(--t200);border-radius:999px;padding:6px 12px 5px}
.note{margin-top:18px;font-size:12px;color:var(--t400)}
.facts{list-style:none;padding:0;margin:clamp(18px,3vh,30px) 0 0;max-width:440px}
.facts li{border-top:1px solid rgba(207,211,236,.18);padding:14px 0 14px;font-size:15px;line-height:1.45;color:var(--t200)}
.facts li strong{display:block;font-family:var(--display);font-weight:500;font-size:14px;color:var(--white);margin-bottom:3px;letter-spacing:-.005em}
.partners{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:26px;max-width:520px}
.partners span{font-family:var(--display);font-weight:500;font-size:clamp(15px,1.3vw,20px);color:var(--t200);letter-spacing:-.01em}

.tags{list-style:none;padding:0;margin:clamp(18px,3vh,28px) 0 0;display:flex;flex-wrap:wrap;gap:8px;max-width:440px}
.tags li{font-size:13px;color:var(--t200);border:1px solid rgba(207,211,236,.28);border-radius:2px;padding:6px 10px 5px}
.partners{display:flex;flex-wrap:wrap;align-items:center;gap:26px 40px;margin-top:28px;max-width:560px}
.partners img{height:24px;width:auto;display:block;opacity:.92}
.partners img.pl-cobham,.partners img.pl-a2z{height:34px}
.partners img.pl-viasat{height:30px}
/* hero imagery over the story text */
.hero{position:relative;width:min(260px,58vw);height:clamp(76px,12.5vh,140px);margin:0 0 clamp(26px,4.6vh,48px);pointer-events:none}
.stats.four b{font-size:clamp(22px,2.05vw,36px);white-space:nowrap}
.stat b{white-space:nowrap}
.hero-i{position:absolute;left:0;bottom:0;width:100%;height:100%;animation:heroIn 2.2s var(--ease) both}
.hero-i img{width:100%;height:100%;object-fit:contain;object-position:left bottom;display:block;filter:drop-shadow(0 0 28px rgba(116,128,204,.35)) drop-shadow(0 20px 26px rgba(3,5,26,.5));animation:heroFloat 12s ease-in-out 1.8s infinite}
.hero-i::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;-webkit-mask:var(--src) left bottom/contain no-repeat;mask:var(--src) left bottom/contain no-repeat;mix-blend-mode:overlay;animation:heroSheen 3.2s var(--ease) .9s both}
.hero-i.back{left:46%;bottom:38%;width:62%;height:62%;opacity:.55;animation-delay:.25s}
.hero-i.back img{animation-delay:2s;filter:drop-shadow(0 0 16px rgba(116,128,204,.4)) blur(.4px)}
@keyframes heroIn{from{opacity:0;transform:translate(-34px,14px) scale(.9);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero-i.back{animation-name:heroInBack}
@keyframes heroInBack{from{opacity:0;transform:translate(24px,-10px) scale(.9);filter:blur(10px)}to{opacity:.55;transform:none;filter:blur(0)}}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-.6deg)}}
@keyframes heroSheen{to{background-position:-60% 0}}
@media (max-width:860px){.hero{height:15vh;width:56vw}}
@media (prefers-reduced-motion:reduce){.hero-i,.hero-i img,.hero-i::after{animation:none}}
/* centered panel variant */
#panel.center{left:50%;transform:translateX(-50%);bottom:auto;top:50%;translate:0 -50%;text-align:center;width:min(760px,calc(100vw - 2*var(--padx)))}
#panel.center p{margin:0 auto}
#panel.center .plogo{margin-left:auto;margin-right:auto}
#panel.center .stats{justify-content:center}

/* altitude instrument */
#alt{position:absolute;right:var(--padx);top:50%;transform:translateY(-50%);display:flex;align-items:stretch;gap:18px}
#altRead{text-align:right;align-self:center;min-width:12ch}
#altRead small{display:block;font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t400);margin-bottom:10px}
#altRead b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(20px,1.7vw,30px);letter-spacing:-.02em;white-space:nowrap;transition:opacity .3s var(--ease)}
#altRead span{display:block;font-size:13px;color:var(--t300);margin-top:6px;transition:opacity .3s var(--ease)}
#ladder{position:relative;width:14px;height:min(52vh,440px)}
#ladder .rail{position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(207,211,236,.22)}
#ladder .tick{position:absolute;right:0;height:1px;width:8px;background:var(--t400);transition:width .4s var(--ease),background .4s var(--ease)}
#ladder .tick.on{width:14px;background:#fff}
#ladder .cursor{position:absolute;right:-3px;width:7px;height:7px;border-radius:50%;background:#fff;transform:translateY(-3px);transition:top 1.6s cubic-bezier(.65,0,.35,1)}

/* act rail */
#rail{position:absolute;left:var(--padx);right:var(--padx);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(18px,4vh,36px));display:flex;gap:10px;pointer-events:auto}
#rail button{all:unset;cursor:pointer;flex:var(--n) 1 0;min-width:96px;padding-top:12px;position:relative}
#rail button::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(207,211,236,.22)}
#rail button i{position:absolute;left:0;top:0;height:1px;background:#fff;width:0;transition:width .9s var(--ease)}
#rail button em{font-style:normal;font-size:12px;color:var(--t400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;transition:color .3s var(--ease)}
#rail button.on em{color:#fff}
#rail button:focus-visible{outline:1px solid #fff;outline-offset:6px}
#count{position:absolute;right:var(--padx);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(44px,7.4vh,66px));font-size:12px;color:var(--t400);font-variant-numeric:tabular-nums}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + clamp(18px,4vh,40px));font-size:13px;color:var(--t300);border:1px solid rgba(207,211,236,.25);border-radius:999px;padding:9px 16px 8px;white-space:nowrap;background:rgba(10,15,71,.45);transition:opacity .6s var(--ease)}
#hint kbd{font-family:var(--display);font-weight:500;font-size:11px;border:1px solid var(--t400);border-radius:2px;padding:2px 6px 1px;margin:0 3px;color:#fff;animation:keyBlink 1s ease-in-out 1.9s 3 both}
#hint kbd+kbd,#hint kbd:last-of-type{animation-delay:2.4s}
@keyframes keyBlink{0%,100%{background:transparent;border-color:var(--t400);box-shadow:none}50%{background:rgba(255,255,255,.92);border-color:#fff;color:#121a6b;box-shadow:0 0 14px rgba(207,211,236,.75)}}
@media (prefers-reduced-motion:reduce){#hint kbd{animation:none}}
#hint.off{opacity:0}

/* 3D-anchored labels */
#labels{position:absolute;inset:0;overflow:hidden}
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity 1s var(--ease);white-space:nowrap;will-change:transform}
.lbl.on{opacity:1}
.lbl::before{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.lbl div{position:absolute;left:12px;top:-9px}
.lbl b{display:block;font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:-.005em}
.lbl span{display:block;font-size:11.5px;color:var(--t300);margin-top:2px}
.lbl.ghost::before{background:transparent;border:1px solid var(--t300);box-shadow:none}
.lbl.ghost b{color:var(--t300)}
.lbl.left div{left:auto;right:12px;text-align:right}
.lbl.big b{font-size:15px}

/* media overlays */
#media{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease)}
#media.on{opacity:1}
.sar{position:absolute;right:calc(var(--padx) + clamp(150px,15vw,240px));top:50%;transform:translateY(-50%);display:flex;gap:14px;align-items:flex-end}
.sar figure{margin:0;width:clamp(150px,13.5vw,230px);opacity:0;transform:translateY(10px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
#media.on .sar figure{opacity:1;transform:none}
#media.on .sar figure:nth-child(2){transition-delay:.25s}
#media.on .sar figure:nth-child(3){transition-delay:.5s}
.sar img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border:1px solid rgba(207,211,236,.25)}
.sar figure:nth-child(2) img{aspect-ratio:4/5.6}
.sar figure:nth-child(3) img{aspect-ratio:4/6.4}
figcaption{font-size:12px;line-height:1.4;color:var(--t300);margin-top:10px}
figcaption b{display:block;font-family:var(--display);font-weight:500;color:#fff;font-size:12.5px}
.tall{position:absolute;right:calc(var(--padx) + clamp(150px,15vw,240px));top:50%;transform:translateY(-50%);height:min(78vh,820px);aspect-ratio:2/3}
.tall img{height:100%;width:100%;object-fit:cover;display:block;border:1px solid rgba(207,211,236,.25)}
.wide{position:absolute;right:calc(var(--padx) + clamp(200px,17vw,290px));top:50%;transform:translateY(-50%);width:min(30vw,540px)}
.wide img{width:100%;display:block;border:1px solid rgba(207,211,236,.25)}
.segs{position:absolute;right:calc(var(--padx) + clamp(150px,15vw,240px));top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;width:min(58vw,980px)}
.seg{border-left:1px solid rgba(207,211,236,.22);padding:4px 18px 4px 18px;opacity:0;transition:opacity .6s var(--ease)}
#media.on .seg{opacity:1}
#media.on .seg:nth-child(2){transition-delay:.12s}#media.on .seg:nth-child(3){transition-delay:.24s}#media.on .seg:nth-child(4){transition-delay:.36s}#media.on .seg:nth-child(5){transition-delay:.48s}
.seg h3{font-family:var(--display);font-weight:500;font-size:clamp(15px,1.25vw,20px);margin:0 0 16px;letter-spacing:-.01em}
.seg ul{list-style:none;margin:0;padding:0}
.seg li{font-size:13.5px;line-height:1.4;color:var(--t200);padding:6px 0}
.phone{position:absolute;right:calc(var(--padx) + clamp(230px,21vw,320px));top:50%;transform:translateY(-46%);width:clamp(180px,15vw,250px)}
.phone svg{width:100%;display:block;overflow:visible}
.beamline{stroke-dasharray:6 10;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.ring{transform-origin:50% 50%;animation:ring 2.4s var(--ease) infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}

#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:var(--deep);transition:opacity .8s var(--ease)}
#loading .ld{width:min(320px,70vw);text-align:left}
#loading .ld small{display:block;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t400);margin-bottom:12px}
#loading .ld b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(20px,1.8vw,28px);letter-spacing:-.02em;color:#fff;margin-bottom:20px}
#loading .track{position:relative;height:2px;background:rgba(207,211,236,.18);overflow:hidden}
#loading .fill{position:absolute;inset:0;background:#fff;transform-origin:left center;transform:scaleX(0);animation:ldFill 2.4s cubic-bezier(.22,1,.36,1) forwards}
#loading.done .fill{animation:none;transform:scaleX(1);transition:transform .45s var(--ease)}
#loading .ld span{display:block;font-size:13px;color:var(--t300);margin-top:12px}
@keyframes ldFill{from{transform:scaleX(0)}to{transform:scaleX(.88)}}
#loading.off{opacity:0;pointer-events:none}

/* presentation scale: larger type for screens and projectors */
#panel{width:min(680px,calc(100vw - 2*var(--padx)));bottom:calc(env(safe-area-inset-bottom,0px) + clamp(84px,12vh,130px))}
#panel h1{font-size:clamp(38px,4.5vw,80px);max-width:100%;overflow-wrap:break-word}
#panel p{font-size:clamp(18px,1.5vw,26px);max-width:34ch;line-height:1.5}
.stat b{font-size:clamp(32px,3.1vw,56px)}
.stat span{font-size:clamp(14px,1.05vw,18px);max-width:18ch;margin-top:10px}
.stats.four{max-width:620px;gap:26px 40px}
.stats.four b{font-size:clamp(28px,2.6vw,46px)}
.tags,.facts{max-width:620px}
.tags li{font-size:clamp(14px,1.02vw,17px);padding:7px 12px 6px}
.facts li{font-size:clamp(16px,1.2vw,20px);padding:14px 0}
.facts li strong{font-size:clamp(16px,1.15vw,19px)}
.note{font-size:clamp(13px,.95vw,15px)}
#panel .plogo{height:clamp(26px,2.8vw,40px)}
#panel .plogo.big{height:clamp(36px,4vw,58px)}
.lbl b{font-size:clamp(14px,1.05vw,18px)}
.lbl span{font-size:clamp(12.5px,.9vw,15px);margin-top:3px}
.lbl div{top:-11px;left:14px}
#altRead small{font-size:clamp(11px,.85vw,13.5px)}
#altRead b{font-size:clamp(24px,2.1vw,38px)}
#altRead span{font-size:clamp(14px,1.05vw,17px)}
#rail button em{font-size:clamp(13px,.95vw,15.5px)}
#count{font-size:clamp(13px,.95vw,15px)}
#hint{font-size:clamp(14px,1vw,16px)}
.partners{flex-wrap:nowrap;width:max-content;max-width:none;gap:0 34px;margin-top:clamp(26px,4vh,40px)}.partners img{height:24px}.partners img.pl-cobham,.partners img.pl-a2z{height:33px}.partners img.pl-viasat{height:30px}
@media (max-width:860px){
  #alt{top:calc(env(safe-area-inset-top,0px) + 20px);transform:none;left:var(--padx);right:auto}
  #ladder{display:none}
  #altRead{text-align:left;align-self:auto}
  #panel{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
  #panel p{font-size:14.5px}
  #rail button em{font-size:0}
  #count{bottom:calc(env(safe-area-inset-bottom,0px) + 42px)}
  .sar{right:auto;left:var(--padx);top:calc(env(safe-area-inset-top,0px) + 96px);transform:none;gap:8px}
  .sar figure{width:28vw}
  .tall{right:auto;left:var(--padx);top:calc(env(safe-area-inset-top,0px) + 96px);transform:none;height:32vh}
  .wide{right:auto;left:var(--padx);top:calc(env(safe-area-inset-top,0px) + 96px);transform:none;width:calc(100vw - 2*var(--padx))}
  .segs{right:auto;left:var(--padx);top:calc(env(safe-area-inset-top,0px) + 118px);transform:none;width:calc(100vw - 2*var(--padx));grid-template-columns:repeat(2,1fr);gap:10px 0}
  .seg li{font-size:12px;padding:3px 0}
  .partners{gap:18px 26px}.partners img{height:18px}.partners img.pl-cobham,.partners img.pl-a2z{height:26px}
  .phone{right:var(--padx);top:calc(env(safe-area-inset-top,0px) + 90px);transform:none;width:30vw}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){.beamline,.ring{animation:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Space42 story, from space to Earth"></canvas>
<div id="veil"></div>
<div id="ui">
  <div id="labels"></div>
  <div id="media" aria-live="polite"></div>
  <div class="chrome">
    <div id="mark"><img alt="Space42" id="markImg"></div>
    <div id="alt" aria-hidden="true">
      <div id="altRead"><small>Altitude</small><b id="altVal">Deep space</b><span id="altName">&nbsp;</span></div>
      <div id="ladder"><div class="rail"></div></div>
    </div>
    <section id="panel" aria-live="polite"></section>
    <div id="count"></div>
    <nav id="rail" aria-label="Chapters"></nav>
    <div id="hint">Press <kbd>→</kbd> or click to continue, <kbd>F</kbd> for fullscreen</div>
  </div>
</div>
<div id="loading" role="status" aria-live="polite"><div class="ld"><small>Space42</small><b>From space to Earth</b><div class="track"><div class="fill"></div></div><span id="ldText">Loading the journey</span></div></div>
<script src="assets/three.min.js"></script>
<script src="assets/space42-assets.js"></script>
<script>(function(){
'use strict';
const A = window.ASSETS;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const D2R = Math.PI/180, TAU = Math.PI*2;
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- renderer & camera ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
const PR = renderer.getPixelRatio();
const camera = new THREE.PerspectiveCamera(40, 1, 0.00002, 12000);
function size(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
/* post-processing: render to a multisampled target, then grade the frame */
const RTC = THREE.WebGLMultisampleRenderTarget && renderer.capabilities.isWebGL2 ? THREE.WebGLMultisampleRenderTarget : THREE.WebGLRenderTarget;
const RT = new RTC(4,4,{format:THREE.RGBAFormat, type:THREE.UnsignedByteType}); if(RT.samples!==undefined) RT.samples=4;
const postScene=new THREE.Scene(), postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{tD:{value:RT.texture},uT:{value:0},uRes:{value:new THREE.Vector2(1,1)},uHaze:{value:0},uDim:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader:`uniform sampler2D tD; uniform float uT,uHaze,uDim; uniform vec2 uRes; varying vec2 vUv;

function dotLayer(arrB64, r, size, color, maxPx, fall){

  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uSize:{value:size},uOp:{value:1},uPR:{value:PR},uCol:{value:new THREE.Color(color)},uMax:{value:maxPx},uHi:{value:0},uHiC:{value:ll(24.2,54.3)},uFall:{value:fall?1:0}},
    vertexShader:VHEAD+'uniform float uSize,uOp,uPR,uMax,uHi,uFall; uniform vec3 uHiC; varying float vA; varying float vH; void main(){ vec4 w=modelMatrix*vec4(position,1.); vec4 mv=viewMatrix*w; gl_Position=projectionMatrix*mv; vec3 n=normalize(w.xyz); vec3 v=normalize(cameraPosition-w.xyz); float face=dot(n,v); vA=smoothstep(-0.02,0.35,face)*uOp; float dd=distance(normalize(position),uHiC); if(uFall>0.) vA*=smoothstep(.06,.025,dd); vH=uHi*smoothstep(.06,.0,dd); gl_PointSize=clamp(uSize*uPR/(-mv.z),.7*uPR,uMax*uPR);'+VTAIL+'}',
    fragmentShader:FHEAD+'uniform vec3 uCol; varying float vA; varying float vH; void main(){'+FLOG+' vec2 c=gl_PointCoord-.5; float d=length(c); if(d>.5) discard; vec3 col=mix(uCol,vec3(1.),vH); gl_FragColor=vec4(col,min(1.,vA*(1.+vH*1.2))*smoothstep(.5,.15,d));}'});
  earth.add(new THREE.Points(g,m)); return m;
}

/* Equatys: 2,800 dots, 60 planes, 3 layers (stylised, not real orbits) */
const EQ=(()=>{
  const layers=[{r:1.32},{r:1.41},{r:1.5}];
  const N=2800, pos=new Float32Array(N*3), aP=new Float32Array(N*4), aI=new Float32Array(N), aL=new Float32Array(N);
  let idx=0; const planeLines=[]; const lineMat=new THREE.LineBasicMaterial({color:0x7480cc,transparent:true,opacity:0,depthWrite:false});
  for(let pl=0;pl<60;pl++){
    const L=pl%3, k=Math.floor(pl/3); const r=layers[L].r; const raan=(k*18+L*6)*D2R; const inc=[53,70,87][L]*D2R; const n=pl<40?47:46;
    const pts=[]; const tmp=V3(0,0,0); for(let s=0;s<=120;s++) pts.push(orbitPos(r,inc,raan,s/120*TAU,tmp).clone());
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat.clone()); orbit.add(ln); planeLines.push(ln);
    for(let s=0;s<n;s++){ aP.set([raan,inc,r,s/n*TAU+k*(TAU/n)*.35],idx*4); aI[idx]=idx/N; aL[idx]=L; idx++; }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('aP',new THREE.BufferAttribute(aP,4)); g.setAttribute('aI',new THREE.BufferAttribute(aI,1)); g.setAttribute('aL',new THREE.BufferAttribute(aL,1));
  g.boundingSphere=new THREE.Sphere(V3(0,0,0),3);
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uT:{value:0},uR:{value:0},uO:{value:0},uPR:{value:PR},uB:{value:0}},
    vertexShader:VHEAD+`attribute vec4 aP; attribute float aI; attribute float aL; uniform float uT,uR,uPR,uB; varying float vA; varying float vF;
      void main(){ float raan=aP.x, inc=aP.y, r=aP.z; float sp=6.2831/(60.+aL*14.); float a=aP.w+uT*sp;
        float x=cos(a)*r, z0=sin(a)*r; float y=-z0*sin(inc), z=z0*cos(inc);
        vec3 p=vec3(x*cos(raan)+z*sin(raan), y, -x*sin(raan)+z*cos(raan));
        vec4 w=modelMatrix*vec4(p,1.); vec4 mv=viewMatrix*w; gl_Position=projectionMatrix*mv;
        float vis=step(aI,uR); vF=vis*exp(-max(uR-aI,0.)*30.);
        vec3 v=normalize(cameraPosition-w.xyz); float behind=step(0.,dot(normalize(w.xyz),v)+.25);
        vA=vis*(.5+.5*behind);
        gl_PointSize=clamp((7.+uB*3.)*uPR*(2.2/(-mv.z)),1.7*uPR,6.5*uPR)*(1.+vF*1.6);`+VTAIL+'}',
    fragmentShader:FHEAD+'uniform float uO; varying float vA; varying float vF; void main(){'+FLOG+' vec2 c=gl_PointCoord-.5; float d=length(c); if(d>.5) discard; gl_FragColor=vec4(mix(vec3(.82,.85,1.),vec3(1.),vF),vA*uO*smoothstep(.5,.1,d));}'});
  orbit.add(new THREE.Points(g,m)); return {m,planeLines};
})();
